name: "Terraform CI/CD"

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  id-token: write    # requis pour OIDC avec Azure
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    env:
      # Variables Azure OIDC
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

      # stage_name dynamique
      TF_VAR_stage_name: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      # backend key dynamique pour séparer les states
      BACKEND_KEY: ${{ github.ref == 'refs/heads/main' && 'prod.tfstate' || 'dev.tfstate' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.BACKEND_CONTAINER }}" \
            -backend-config="key=${BACKEND_KEY}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=${{vars.TF_VAR_stage_name}}.tfplan

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{vars.TF_VAR_stage_name}}.tfplan
          path: .

  apply:
    runs-on: ubuntu-latest
    needs: 
      - terraform
    environment: production    # ajoute une approbation manuelle GitHub ici
    defaults:
      run:
        working-directory: .

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_stage_name: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      BACKEND_KEY: ${{ github.ref == 'refs/heads/main' && 'prod.tfstate' || 'dev.tfstate' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.3

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: ${{vars.TF_VAR_stage_name}}.tfplan
          path: .

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.BACKEND_CONTAINER }}" \
            -backend-config="key=${BACKEND_KEY}"

      - name: Terraform Apply
        run: terraform apply -auto-approve ${{vars.TF_VAR_stage_name}}.tfplan
